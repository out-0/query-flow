[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-flow"
version = "0.1.0"
description = "Information Retrieval system with hybrid search routing"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.6.0",
    "lxml>=4.9.0",
]

[tool.setuptools]
py-modules = [
    "app",
    "config",
    "LocalSearXNGProvider",
    "PublicSearXNGProviderPool",
    "fetch_layer",
    "extraction_layer",
    "filtering_layer",
    "ranking_layer",
    "output_layer"
]
